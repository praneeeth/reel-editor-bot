[project]
name = "reelbot"
version = "0.1.0"
description = "Telegram bot that edits clips into vertical Reels/Shorts with the video-use skill"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.6,<23",
    "python-dotenv>=1.0",
    # video-use helper dependencies (vendor/video-use/pyproject.toml), installed in the same venv
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reelbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
